<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="travelcss/travel.css">
    <link rel="shortcut icon" href="holiday_favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <title>Document</title>
</head>

<body>
    <main>
        <section id="arrow">
            <div class="back_arrow">
                <a href="index.html">
                    <div class="left_arrow">
                        <i class="fa-solid fa-arrow-left"></i>
                    </div>
                </a>
            </div>
        </section>

        <section id="bookingPage">
            <div class="booking_top">
                <h1>Booking Here!</h1>
            </div>
            <div class="booking_bottom">
                <form class="booking_form">
                    <div class="booking_form_input">
                        <label>Name</label>
                        <input type="text" placeholder="enter your name">
                    </div>
                    <div class="booking_form_2nd">
                        <div class="booking_form_input">
                            <label>Age</label>
                            <input type="number" placeholder="enter your age">
                        </div>
                        <div class="booking_form_input">
                            <label>Phone Number</label>
                            <input type="text" placeholder="phone number">
                        </div>
                    </div>
                    <div class="booking_form_3rd">
                        <div class="booking_form_input">
                            <label>How many people</label>
                            <input type="number">
                        </div>
                        <div class="booking_form_input">
                            <label>Date</label>
                            <input type="date" placeholder="enter your name">
                        </div>
                    </div>
                    <div class="booking_form_submit">
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
