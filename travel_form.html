<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="travelcss/travel.css">
    <link rel="shortcut icon" href="holiday_favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>Holiday_form</title>
</head>

<body>
    <main>
        <div class="holiday_form">
            <form class="holiday_form_box">
                <div class="holiday_form_box_input">
                    <label>Username</label>
                    <input type="text" placeholder="enter your name">
                </div>
                <div class="holiday_form_box_input">
                    <label>Password</label>
                    <input type="text" placeholder="enter your Password">
                </div>
                <div class="age_genderbox">
                    <div class="holiday_form_box_input">
                        <label>Age</label>
                        <input type="number" placeholder="enter your age">
                    </div>
                    <div class="holiday_form_box_input">
                        <label>Gender</label>
                        <select class="gender">
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>
                </div>
                <div class="holiday_form_box_input">
                    <label>Why choose our agency?</label>
                    <textarea></textarea>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
